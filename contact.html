<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Contact — fashion1sta</title>

<style>
  :root{
    --bg:#0a0b0d;--card:#17191c;
    --silver:#b8bcc4;--silver-bright:#f2f4f7;--silver-deep:#6b6f76;
    --text:#f2f3f5;--text-dim:#9195a0;--line:rgba(184,188,196,0.22);
    --radius:2px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;}
  .display{font-family:'Fraunces',serif;}
  a{color:var(--silver-bright);}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:rgba(10,11,13,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .navicon{width:20px;height:20px;}
  .logo{font-family:'Fraunces',serif;font-size:19px;letter-spacing:0.14em;font-weight:600;background:linear-gradient(120deg,var(--silver-deep),var(--silver-bright) 45%,var(--silver));-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none;}
  main{max-width:640px;margin:0 auto;padding:28px 22px 60px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:26px;margin-bottom:6px;}
  .updated{font-size:12px;color:var(--text-dim);margin-bottom:28px;}
  .contact-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:12px;}
  .contact-card svg{width:20px;height:20px;flex-shrink:0;color:var(--silver);}
  .contact-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:3px;}
  .contact-card .value{font-size:14px;color:var(--silver-bright);font-weight:600;}
  .socials{display:flex;gap:14px;margin-top:26px;}
  .socials a{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .socials svg{width:16px;height:16px;color:var(--silver);}
  h2{font-family:'Fraunces',serif;font-weight:500;font-size:16px;margin:30px 0 14px;color:var(--silver-bright);}
  p{font-size:13.5px;color:var(--text-dim);}
</style>
</head>
<body>

<header>
