<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>fashion1sta</title>
<meta name="theme-color" content="#0a0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d;--bg-alt:#15171a;--card:#17191c;
    --silver:#b8bcc4;--silver-bright:#f2f4f7;--silver-deep:#6b6f76;
    --text:#f2f3f5;--text-dim:#9195a0;--line:rgba(184,188,196,0.22);
    --radius:2px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .display{font-family:'Fraunces',serif;}
  a{color:inherit;text-decoration:none;}
  img,svg{display:block;max-width:100%;}
  button{font-family:inherit;}

  header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:rgba(10,11,13,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .navicon{width:20px;height:20px;opacity:0.85;}
  .logo{font-family:'Fraunces',serif;font-size:21px;letter-spacing:0.14em;font-weight:600;background:linear-gradient(120deg,var(--silver-deep),var(--silver-bright) 45%,var(--silver));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .cart-btn{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:var(--silver);padding:0;}
  .cart-badge{position:absolute;top:-3px;right:-3px;background:var(--silver-bright);color:var(--bg);font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1;}
  .cart-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .ci-media{width:48px;height:48px;flex-shrink:0;background:var(--card);border-radius:4px;overflow:hidden;}
  .ci-media img{width:100%;height:100%;object-fit:cover;}
  .ci-info{flex:1;min-width:0;}
  .ci-info h4{font-size:13px;font-weight:600;margin-bottom:3px;}
  .ci-info p{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .ci-qty{display:flex;align-items:center;gap:10px;}
  .qty-btn{width:22px;height:22px;border:1px solid var(--line);border-radius:4px;background:none;color:var(--silver);cursor:pointer;font-size:13px;line-height:1;}
  .ci-qty span{font-size:12.5px;min-width:16px;text-align:center;}
  .ci-remove{background:none;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;flex-shrink:0;}
  .cart-footer{position:sticky;bottom:0;background:var(--bg-alt);padding-top:16px;margin-top:8px;border-top:1px solid var(--line);}
  .cart-total-row{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:14px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--silver-bright);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity 0.3s ease, transform 0.3s ease;z-index:60;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,0.6);opacity:0;pointer-events:none;transition:opacity 0.35s ease;z-index:45;}
  .scrim.open{opacity:1;pointer-events:auto;}
  nav.drawer{position:fixed;inset:0 0 0 auto;width:min(88vw,380px);height:100vh;background:var(--bg-alt);border-left:1px solid var(--line);transform:translateX(100%);transition:transform 0.35s ease;z-index:50;overflow-y:auto;padding:26px 22px 40px;}
  nav.drawer.open{transform:translateX(0);}
  .drawer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .drawer-top h2{font-family:'Fraunces',serif;font-size:15px;letter-spacing:0.22em;color:var(--silver);}
  .drawer-close{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--silver);cursor:pointer;font-size:15px;}

  .breadcrumb{padding:14px 22px 0;font-size:11.5px;color:var(--text-dim);}
  .breadcrumb a{color:var(--silver);}

  .p-frame{position:relative;margin:18px 22px;aspect-ratio:1/0.85;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(184,188,196,0.10),transparent 70%);}
  .p-frame img{width:80%;height:80%;object-fit:contain;}
  .p-frame svg{width:60%;}
  .discount-badge{position:absolute;top:10px;left:10px;background:var(--silver-bright);color:var(--bg);font-size:11px;font-weight:700;padding:4px 9px;border-radius:3px;}

  .p-info{padding:0 22px;}
  .p-info h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(20px,5.5vw,26px);margin-bottom:10px;}
  .p-price{font-size:20px;font-weight:600;color:var(--silver-bright);margin-bottom:4px;}
  .p-price .was{font-size:14px;color:var(--text-dim);text-decoration:line-through;margin-left:8px;font-weight:400;}
  .p-sold{font-size:12px;color:var(--text-dim);margin-bottom:20px;}

  .qty-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .qty-row .label{font-size:12.5px;color:var(--text-dim);}
  .qty-control{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:20px;padding:6px 16px;}
  .qty-control button{background:none;border:none;color:var(--silver);font-size:16px;cursor:pointer;}
  .qty-control span{font-size:14px;min-width:16px;text-align:center;}

  .p-actions{display:flex;gap:10px;margin-bottom:28px;}
  .btn-outline{flex:1;text-align:center;padding:14px 0;font-size:13.5px;font-weight:600;border:1px solid var(--silver-deep);color:var(--silver-bright);border-radius:var(--radius);background:none;cursor:pointer;}
  .btn-solid{flex:1;text-align:center;padding:14px 0;font-size:13.5px;font-weight:600;border:1px solid var(--silver-bright);color:var(--bg);background:linear-gradient(120deg,var(--silver),var(--silver-bright));border-radius:var(--radius);cursor:pointer;}

  section.collection{padding:6px 22px 48px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:13px;}
  .section-head h2{font-family:'Fraunces',serif;font-weight:500;font-size:19px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr);}}
  .card{background:transparent;border:none;padding:6px 4px 10px;}
  .card-link{display:block;}
  .frame{position:relative;aspect-ratio:1/0.72;display:flex;align-items:center;justify-content:center;margin-bottom:13px;}
  .frame img{width:100%;height:100%;object-fit:contain;}
  .frame svg{width:70%;}
  .card h3{font-family:'Fraunces',serif;font-weight:500;font-size:13.5px;margin-bottom:6px;line-height:1.3;}
  .price{font-size:13px;margin-bottom:8px;}
  .price .now{color:var(--silver-bright);font-weight:600;}
  .price .was{color:var(--text-dim);text-decoration:line-through;margin-left:6px;font-size:11.5px;}

  .not-found{padding:80px 22px;text-align:center;color:var(--text-dim);}
</style>
</head>
<body>

<header>
  <a href="index.html"><svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 6l-6 6 6 6"/></svg></a>
  <a href="index.html" class="logo">fashion1sta</a>
  <button class="cart-btn" onclick="toggleCart(true)" aria-label="Cart">
    <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="21" r="1.3"/><circle cx="18" cy="21" r="1.3"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"/></svg>
    <span class="cart-badge" id="cartBadge">0</span>
  </button>
</header>

<div class="scrim" id="scrim" onclick="toggleCart(false)"></div>
<nav class="drawer" id="cartDrawer">
  <div class="drawer-top"><h2>YOUR CART</h2><div class="drawer-close" onclick="toggleCart(false)">✕</div></div>
  <div id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total-row"><span>Total</span><span id="cartTotal">BDT 0</span></div>
    <button class="btn-solid" id="cartCheckoutBtn" onclick="checkoutCart()">Checkout via WhatsApp</button>
  </div>
</nav>

<div id="productRoot">
  <p class="not-found">Loading...</p>
</div>

<script type="module">
import { db, collection, getDocs } from './js/firebase-config.js';
import { addToCart, buyNowWhatsApp, renderCartDrawer, updateCartBadge, checkoutWhatsApp, showToast, wireAddToCart } from './js/cart.js';

window.toggleCart = function(open){
  document.getElementById('cartDrawer').classList.toggle('open',open);
  document.getElementById('scrim').classList.toggle('open',open);
  if(open) renderCartDrawer();
};
window.checkoutCart = checkoutWhatsApp;

function glassesSVG(){return `<svg viewBox="0 0 100 46" fill="none"><circle cx="26" cy="23" r="19" stroke="url(#pg1)" stroke-width="2.5"/><circle cx="74" cy="23" r="19" stroke="url(#pg1)" stroke-width="2.5"/><line x1="45" y1="23" x2="55" y2="23" stroke="url(#pg1)" stroke-width="2.5"/><line x1="7" y1="16" x2="0" y2="11" stroke="url(#pg1)" stroke-width="2.5" stroke-linecap="round"/><line x1="93" y1="16" x2="100" y2="11" stroke="url(#pg1)" stroke-width="2.5" stroke-linecap="round"/><defs><linearGradient id="pg1" x1="0" y1="0" x2="100" y2="46"><stop offset="0%" stop-color="#6b6f76"/><stop offset="55%" stop-color="#f2f4f7"/><stop offset="100%" stop-color="#b8bcc4"/></linearGradient></defs></svg>`;}
function crossSVG(){return `<svg viewBox="0 0 60 60" fill="none"><path d="M30 6 L30 54 M12 24 L48 24" stroke="url(#pg3)" stroke-width="4" stroke-linecap="round"/><defs><linearGradient id="pg3" x1="0" y1="0" x2="60" y2="60"><stop offset="0%" stop-color="#6b6f76"/><stop offset="55%" stop-color="#f2f4f7"/><stop offset="100%" stop-color="#b8bcc4"/></linearGradient></defs></svg>`;}
function chainSVG(){return `<svg viewBox="0 0 90 50" fill="none"><ellipse cx="22" cy="25" rx="14" ry="9" stroke="url(#pg4)" stroke-width="2.2"/><ellipse cx="46" cy="25" rx="14" ry="9" stroke="url(#pg4)" stroke-width="2.2"/><ellipse cx="70" cy="25" rx="14" ry="9" stroke="url(#pg4)" stroke-width="2.2"/><defs><linearGradient id="pg4" x1="0" y1="0" x2="90" y2="50"><stop offset="0%" stop-color="#6b6f76"/><stop offset="55%" stop-color="#f2f4f7"/><stop offset="100%" stop-color="#b8bcc4"/></linearGradient></defs></svg>`;}
function iconFor(type){
  if(type==="glasses") return glassesSVG();
  if(type==="chain") return chainSVG();
  return crossSVG();
}

const seedAll = [
  {id:"tennis-chain-bracelet", name:"Tennis Chain Bracelet", price:599, was:800, category:"Accessories", iconType:"chain", sold:1240},
  {id:"vampire-fang-grillz", name:"Vampire Fang Grillz", price:799, was:1200, category:"Accessories", iconType:"cross", sold:860},
  {id:"dragon-flame-belt", name:"Dragon Flame Belt", price:990, was:1500, category:"Accessories", iconType:"chain", sold:430},
  {id:"gothic-cross-pendant", name:"Gothic Cross Pendant", price:650, was:900, category:"Accessories", iconType:"cross", sold:990},
  {id:"gothic-cross-rimless", name:"Gothic Cross Rimless", price:990, was:1300, category:"Glasses", iconType:"glasses", sold:2100},
  {id:"vintage-sun-frame", name:"Vintage Sun Frame", price:850, was:1100, category:"Glasses", iconType:"glasses", sold:1560},
  {id:"neon-aviator-link", name:"Neon Aviator Link", price:750, was:1000, category:"Glasses", iconType:"glasses", sold:980},
  {id:"iced-bridge-round", name:"Iced Bridge Round", price:1099, was:1500, category:"Glasses", iconType:"glasses", sold:640}
];

async function loadAllProducts(){
  try{
    const snap = await getDocs(collection(db,'products'));
    if(snap.empty) return seedAll;
    return snap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){
    console.error('Products load failed, using seed data:', e);
    return seedAll;
  }
}

function miniCard(p,i){
  const media = p.imageUrl
    ? `<img src="${p.imageUrl}" alt="${p.name}" style="width:100%;height:100%;object-fit:contain;">`
    : iconFor(p.iconType);
  return `
    <div class="card">
      <a href="product.html?id=${encodeURIComponent(p.id)}" class="card-link">
        <div class="frame">${media}</div>
        <h3>${p.name}</h3>
      </a>
      <div class="price"><span class="now">BDT ${p.price}</span>${p.was?`<span class="was">BDT ${p.was}</span>`:''}</div>
    </div>`;
}

let qty = 1;

async function init(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const all = await loadAllProducts();
  const product = all.find(p=>p.id===id);
  const root = document.getElementById('productRoot');

  if(!product){
    root.innerHTML = `<p class="not-found">Product not found. <a href="shop.html" style="color:var(--silver-bright);">Back to shop →</a></p>`;
    return;
  }

  const discount = product.was ? Math.round((1 - product.price/product.was) * 100) : 0;
  const soldText = product.sold ? `${product.sold >= 1000 ? (product.sold/1000).toFixed(1).replace('.0','')+'k' : product.sold} sold` : '';
  const media = product.imageUrl
    ? `<img src="${product.imageUrl}" alt="${product.name}">`
    : iconFor(product.iconType);

  root.innerHTML = `
    <div class="breadcrumb"><a href="shop.html">Shop</a> / <a href="shop.html?category=${encodeURIComponent(product.category||'')}">${product.category||''}</a></div>
    <div class="p-frame">
      ${discount>0 ? `<span class="discount-badge">-${discount}% OFF</span>` : ''}
      ${media}
    </div>
    <div class="p-info">
      <h1 class="display">${product.name}</h1>
      <div class="p-price">BDT ${product.price}${product.was?`<span class="was">BDT ${product.was}</span>`:''}</div>
      ${soldText ? `<p class="p-sold">${soldText}</p>` : ''}
      <div class="qty-row">
        <span class="label">Quantity</span>
        <div class="qty-control">
          <button id="qtyDec">−</button>
          <span id="qtyVal">1</span>
          <button id="qtyInc">+</button>
        </div>
      </div>
      <div class="p-actions">
        <button class="btn-outline" id="addCartBtn">Add to Cart</button>
        <button class="btn-solid" id="buyNowBtn">Buy Now</button>
      </div>
    </div>
    <section class="collection">
      <div class="section-head"><h2 class="display">Similar Products</h2></div>
      <div class="grid" id="similarGrid"></div>
    </section>`;

  document.getElementById('qtyDec').addEventListener('click', ()=>{
    qty = Math.max(1, qty-1);
    document.getElementById('qtyVal').textContent = qty;
  });
  document.getElementById('qtyInc').addEventListener('click', ()=>{
    qty += 1;
    document.getElementById('qtyVal').textContent = qty;
  });
  document.getElementById('addCartBtn').addEventListener('click', ()=>{
    for(let i=0;i<qty;i++){
      addToCart({ id: product.id, name: product.name, price: product.price, imageUrl: product.imageUrl||null });
    }
    showToast(`Added ${qty} × "${product.name}" to cart`);
  });
  document.getElementById('buyNowBtn').addEventListener('click', ()=>{
    buyNowWhatsApp({ name: product.name, price: product.price }, qty);
  });

  const similar = all.filter(p=>p.category===product.category && p.id!==product.id).slice(0,4);
  document.getElementById('similarGrid').innerHTML = similar.map((p,i)=>miniCard(p,i)).join('');

  updateCartBadge();
  renderCartDrawer();
}
init();
</script>
</body>
</html>
