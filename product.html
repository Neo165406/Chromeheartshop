<script type="module">
import { db, collection, getDocs } from './js/firebase-config.js';
import { addToCart, buyNowWhatsApp, renderCartDrawer, updateCartBadge, checkoutWhatsApp, showToast } from './js/cart.js';

window.toggleCart = function(open){
  document.getElementById('cartDrawer').classList.toggle('open', open);
  document.getElementById('scrim').classList.toggle('open', open);
  if(open) renderCartDrawer();
};
window.checkoutCart = checkoutWhatsApp;

function glassesSVG(){return `<svg viewBox="0 0 100 46" fill="none"><circle cx="26" cy="23" r="19" stroke="url(#pg1)" stroke-width="2.5"/><circle cx="74" cy="23" r="19" stroke="url(#pg1)" stroke-width="2.5"/><line x1="45" y1="23" x2="55" y2="23" stroke="url(#pg1)" stroke-width="2.5"/><line x1="7" y1="16" x2="0" y2="11" stroke="url(#pg1)" stroke-width="2.5" stroke-linecap="round"/><line x1="93" y1="16" x2="100" y2="11" stroke="url(#pg1)" stroke-width="2.5" stroke-linecap="round"/><defs><linearGradient id="pg1" x1="0" y1="0" x2="100" y2="46"><stop offset="0%" stop-color="#6b6f76"/><stop offset="55%" stop-color="#f2f4f7"/><stop offset="100%" stop-color="#b8bcc4"/></linearGradient></defs></svg>`;}
function crossSVG(){return `<svg viewBox="0 0 60 60" fill="none"><path d="M30 6 L30 54 M12 24 L48 24" stroke="url(#pg3)" stroke-width="4" stroke-linecap="round"/><defs><linearGradient id="pg3" x1="0" y1="0" x2="60" y2="60"><stop offset="0%" stop-color="#6b6f76"/><stop offset="55%" stop-color="#f2f4f7"/><stop offset="100%" stop-color="#b8bcc4"/></linearGradient></defs></svg>`;}
function chainSVG(){return `<svg viewBox="0 0 90 50" fill="none"><ellipse cx="22" cy="25" rx="14" ry="9" stroke="url(#pg4)" stroke-width="2.2"/><ellipse cx="46" cy="25" rx="14" ry="9" stroke="url(#pg4)" stroke-width="2.2"/><ellipse cx="70" cy="25" rx="14" ry="9" stroke="url(#pg4)" stroke-width="2.2"/><defs><linearGradient id="pg4" x1="0" y1="0" x2="90" y2="50"><stop offset="0%" stop-color="#6b6f76"/><stop offset="55%" stop-color="#f2f4f7"/><stop offset="100%" stop-color="#b8bcc4"/></linearGradient></defs></svg>`;}

function iconFor(type){
  if(type==="glasses") return glassesSVG();
  if(type==="chain") return chainSVG();
  return crossSVG();
}

const seedAll = [
  {id:"tennis-chain-bracelet", name:"Tennis Chain Bracelet", price:599, was:800, category:"Accessories", iconType:"chain", sold:1240},
  {id:"vampire-fang-grillz", name:"Vampire Fang Grillz", price:799, was:1200, category:"Accessories", iconType:"cross", sold:860},
  {id:"dragon-flame-belt", name:"Dragon Flame Belt", price:990, was:1500, category:"Accessories", iconType:"chain", sold:430},
  {id:"gothic-cross-pendant", name:"Gothic Cross Pendant", price:650, was:900, category:"Accessories", iconType:"cross", sold:990},
  {id:"gothic-cross-rimless", name:"Gothic Cross Rimless", price:990, was:1300, category:"Glasses", iconType:"glasses", sold:2100},
  {id:"vintage-sun-frame", name:"Vintage Sun Frame", price:850, was:1100, category:"Glasses", iconType:"glasses", sold:1560},
  {id:"neon-aviator-link", name:"Neon Aviator Link", price:750, me:1000, category:"Glasses", iconType:"glasses", sold:980},
  {id:"iced-bridge-round", name:"Iced Bridge Round", price:1099, was:1500, category:"Glasses", iconType:"glasses", sold:640}
];

async function loadAllProducts(){
  try {
    const fetchPromise = getDocs(collection(db,'products'));
    // Reduced timeout to 2 seconds for quicker fallback
    const timeout = new Promise(resolve => setTimeout(() => resolve(null), 2000));
    const snap = await Promise.race([fetchPromise, timeout]);
    
    if(!snap || snap.empty) {
      console.warn('Firestore timed out or empty. Using seed data.');
      return seedAll;
    }
    
    return snap.docs.map(d => {
      const data = d.data();
      return {
        id: d.id,            // Firestore Doc ID
        slug: data.id || '', // Custom ID fallback
        ...data
      };
    });
  } catch(e) {
    console.error('Products load failed, using seed data:', e);
    return seedAll;
  }
}

function miniCard(p){
  const media = p.imageUrl
    ? `<img src="${p.imageUrl}" alt="${p.name}" style="width:100%;height:100%;object-fit:contain;">`
    : iconFor(p.iconType);
  return `
    <div class="card">
      <a href="product.html?id=${encodeURIComponent(p.id || p.slug)}" class="card-link">
        <div class="frame">${media}</div>
        <h3>${p.name}</h3>
      </a>
      <div class="price"><span class="now">BDT ${p.price}</span>${p.was?`<span class="was">BDT ${p.was}</span>`:''}</div>
    </div>`;
}

let qty = 1;

async function init(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  
  if(!id) {
    document.getElementById('productRoot').innerHTML = `<p class="not-found">No product specified. <a href="shop.html" style="color:var(--silver-bright);">Back to shop →</a></p>`;
    return;
  }

  const all = await loadAllProducts();
  // Matching by id or custom slug
  const product = all.find(p => p.id === id || p.slug === id);
  const root = document.getElementById('productRoot');

  if(!product){
    root.innerHTML = `<p class="not-found">Product not found. <a href="shop.html" style="color:var(--silver-bright);">Back to shop →</a></p>`;
    return;
  }

  const discount = product.was ? Math.round((1 - product.price/product.was) * 100) : 0;
  const soldText = product.sold ? `${product.sold >= 1000 ? (product.sold/1000).toFixed(1).replace('.0','')+'k' : product.sold} sold` : '';
  const media = product.imageUrl
    ? `<img src="${product.imageUrl}" alt="${product.name}">`
    : iconFor(product.iconType);

  root.innerHTML = `
    <div class="breadcrumb"><a href="shop.html">Shop</a> / <a href="shop.html?category=${encodeURIComponent(product.category||'')}">${product.category||''}</a></div>
    <div class="p-frame">
      ${discount>0 ? `<span class="discount-badge">-${discount}% OFF</span>` : ''}
      ${media}
    </div>
    <div class="p-info">
      <h1 class="display">${product.name}</h1>
      <div class="p-price">BDT ${product.price}${product.was?`<span class="was">BDT ${product.was}</span>`:''}</div>
      ${soldText ? `<p class="p-sold">${soldText}</p>` : ''}
      <div class="qty-row">
        <span class="label">Quantity</span>
        <div class="qty-control">
          <button id="qtyDec">−</button>
          <span id="qtyVal">1</span>
          <button id="qtyInc">+</button>
        </div>
      </div>
      <div class="p-actions">
        <button class="btn-outline" id="addCartBtn">Add to Cart</button>
        <button class="btn-solid" id="buyNowBtn">Buy Now</button>
      </div>
    </div>
    <section class="collection">
      <div class="section-head"><h2 class="display">Similar Products</h2></div>
      <div class="grid" id="similarGrid"></div>
    </section>`;

  document.getElementById('qtyDec').addEventListener('click', ()=>{
    qty = Math.max(1, qty-1);
    document.getElementById('qtyVal').textContent = qty;
  });
  document.getElementById('qtyInc').addEventListener('click', ()=>{
    qty += 1;
    document.getElementById('qtyVal').textContent = qty;
  });
  document.getElementById('addCartBtn').addEventListener('click', ()=>{
    for(let i=0; i<qty; i++){
      addToCart({ id: product.id || product.slug, name: product.name, price: product.price, imageUrl: product.imageUrl||null });
    }
    showToast(`Added ${qty} × "${product.name}" to cart`);
  });
  document.getElementById('buyNowBtn').addEventListener('click', ()=>{
    buyNowWhatsApp({ name: product.name, price: product.price }, qty);
  });

  const similar = all.filter(p => p.category === product.category && (p.id !== product.id && p.slug !== product.slug)).slice(0,4);
  document.getElementById('similarGrid').innerHTML = similar.map(miniCard).join('');

  updateCartBadge();
  renderCartDrawer();
}

init().catch(e => {
  console.error('Product page failed to load:', e);
  document.getElementById('productRoot').innerHTML =
    `<p class="not-found">Something went wrong loading this product. <a href="shop.html" style="color:var(--silver-bright);">Back to shop →</a></p>`;
});
</script>
