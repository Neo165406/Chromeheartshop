<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Checkout — FASHIONISTA</title>
<meta name="theme-color" content="#0a0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d;--bg-alt:#15171a;--card:#17191c;
    --silver:#b8bcc4;--silver-bright:#f2f4f7;--silver-deep:#6b6f76;
    --text:#f2f3f5;--text-dim:#9195a0;--line:rgba(184,188,196,0.22);
    --radius:2px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .display{font-family:'Fraunces',serif;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:rgba(10,11,13,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .navicon{width:20px;height:20px;}
  .logo{font-family:'Fraunces',serif;font-size:19px;letter-spacing:0.14em;font-weight:600;background:linear-gradient(120deg,var(--silver-deep),var(--silver-bright) 45%,var(--silver));-webkit-background-clip:text;background-clip:text;color:transparent;}

  .page-title{padding:28px 22px 6px;font-family:'Fraunces',serif;font-size:24px;font-weight:500;}

  .section{padding:18px 22px;}
  .section-label{font-size:11px;letter-spacing:0.14em;color:var(--text-dim);text-transform:uppercase;margin-bottom:14px;}

  .summary-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .si-media{width:44px;height:44px;flex-shrink:0;background:var(--card);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .si-media img{width:100%;height:100%;object-fit:cover;}
  .si-info{flex:1;min-width:0;}
  .si-info h4{font-size:13px;font-weight:600;margin-bottom:2px;}
  .si-info p{font-size:11.5px;color:var(--text-dim);}
  .si-total{font-size:13px;font-weight:600;color:var(--silver-bright);white-space:nowrap;}

  /* Quantity + remove controls */
  .si-qty{display:inline-flex;align-items:center;margin-top:8px;border:1px solid var(--line);border-radius:var(--radius);}
  .si-qty .qty-btn{width:30px;height:28px;background:none;border:none;color:var(--silver-bright);font-size:16px;line-height:1;cursor:pointer;}
  .si-qty .qty-btn:active{background:rgba(184,188,196,0.15);}
  .si-qty span{min-width:28px;text-align:center;font-size:13px;font-weight:600;}
  .si-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .si-remove{background:none;border:none;color:var(--text-dim);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:2px 0;}
  .si-remove:active{color:#e08a8a;}
  .add-more{display:inline-block;margin-top:12px;font-size:12.5px;color:var(--silver);}

  .total-row{display:flex;justify-content:space-between;padding-top:16px;font-size:16px;font-weight:600;}
  .total-row span:last-child{color:var(--silver-bright);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field input, .field textarea{
    width:100%;padding:12px 14px;background:var(--card);border:1px solid var(--line);
    color:var(--text);border-radius:var(--radius);font-size:14px;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--silver);}
  .field .err{color:#e08a8a;font-size:11.5px;margin-top:5px;display:none;}
  .field.invalid input, .field.invalid textarea{border-color:#e08a8a;}
  .field.invalid .err{display:block;}

  .pay-note{
    display:flex;align-items:flex-start;gap:10px;padding:14px 16px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    font-size:12.5px;color:var(--text-dim);margin-bottom:22px;
  }
  .pay-note svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--silver);}

  .place-btn{
    width:100%;padding:16px 0;text-align:center;
    background:linear-gradient(120deg,var(--silver),var(--silver-bright));
    color:var(--bg);border:none;border-radius:var(--radius);
    font-size:14.5px;font-weight:700;letter-spacing:0.02em;cursor:pointer;
  }
  .place-btn:disabled{opacity:0.5;}
  .status-msg{text-align:center;font-size:12.5px;color:var(--text-dim);margin-top:12px;}

  .empty-state, .confirm-state{padding:80px 22px;text-align:center;}
  .empty-state p, .confirm-state p{color:var(--text-dim);font-size:13.5px;margin-bottom:20px;}
  .confirm-state h2{font-family:'Fraunces',serif;font-size:22px;margin-bottom:12px;}
  .confirm-icon{width:56px;height:56px;margin:0 auto 20px;border:1px solid var(--silver);border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .confirm-icon svg{width:26px;height:26px;color:var(--silver-bright);}
  .link-btn{display:inline-block;padding:13px 26px;border:1px solid var(--silver-deep);color:var(--silver-bright);border-radius:var(--radius);font-size:13px;font-weight:600;}

  /* ---------- Invoice (shown after an order is placed) ---------- */
  .invoice{
    text-align:left;max-width:420px;margin:26px auto 0;padding:22px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  }
  .inv-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .inv-logo{font-family:'Fraunces',serif;font-size:16px;letter-spacing:0.1em;color:var(--silver-bright);}
  .inv-sub{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;margin-top:2px;}
  .inv-meta{text-align:right;font-size:12px;color:var(--text-dim);}
  .inv-meta b{color:var(--silver-bright);}
  .inv-customer{font-size:12.5px;color:var(--text-dim);margin-bottom:16px;line-height:1.6;}
  .inv-customer b{color:var(--text);}
  .inv-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px;}
  .inv-table th{text-align:left;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);padding-bottom:8px;border-bottom:1px solid var(--line);}
  .inv-table td{padding:8px 0;border-bottom:1px solid var(--line);color:var(--text);}
  .inv-totals{font-size:12.5px;color:var(--text-dim);}
  .inv-totals div{display:flex;justify-content:space-between;padding:4px 0;}
  .inv-grand{font-size:14px;font-weight:700;color:var(--silver-bright);padding-top:8px;margin-top:6px;border-top:1px solid var(--line);}
  .inv-note{font-size:11.5px;color:var(--text-dim);margin-top:14px;}
  #printInvoiceBtn{width:100%;margin-top:16px;padding:12px 0;text-align:center;font-size:12.5px;font-weight:600;color:var(--silver-bright);background:none;border:1px solid var(--silver-deep);border-radius:var(--radius);cursor:pointer;}

  @media print{
    body *{visibility:hidden;}
    .invoice, .invoice *{visibility:visible;}
    .invoice{position:absolute;left:0;top:0;width:100%;max-width:none;margin:0;border:none;background:#fff;color:#111;padding:24px;}
    .inv-logo, .inv-meta b, .inv-table td{color:#111;}
    .inv-sub, .inv-meta, .inv-customer, .inv-totals, .inv-table th, .inv-note{color:#444;}
    .inv-table th, .inv-table td{border-color:#ccc;}
    .inv-grand{color:#111;border-color:#999;}
    #printInvoiceBtn{display:none;}
  }

  /* ---------- Interactive glow (Buy Now & other buttons) ---------- */
  .place-btn,.link-btn,#couponApplyBtn{
    transition:box-shadow 0.25s ease, filter 0.25s ease;
  }
  .place-btn:hover,.link-btn:hover,#couponApplyBtn:hover,
  .place-btn:active,.link-btn:active,#couponApplyBtn:active{
    box-shadow:0 0 10px 2px rgba(242,244,247,0.5),0 0 26px 7px rgba(184,188,196,0.32);
    filter:brightness(1.12);
    animation:btnGlowPulse 1.1s ease-in-out infinite;
  }
  .place-btn:disabled:hover,.place-btn:disabled:active{
    box-shadow:none;filter:none;animation:none;
  }
  @keyframes btnGlowPulse{
    0%,100%{box-shadow:0 0 10px 2px rgba(242,244,247,0.45),0 0 22px 5px rgba(184,188,196,0.28);}
    50%{box-shadow:0 0 18px 5px rgba(242,244,247,0.85),0 0 36px 11px rgba(184,188,196,0.5);}
  }
  @media (prefers-reduced-motion: reduce){
    .place-btn:hover,.link-btn:hover,#couponApplyBtn:hover,
    .place-btn:active,.link-btn:active,#couponApplyBtn:active{
      animation:none;
    }
  }
</style>
</head>
<body>

<header>
  <a href="index.html"><svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 6l-6 6 6 6"/></svg></a>
  <a href="index.html" class="logo">FASHIONISTA</a>
  <span style="width:20px;"></span>
</header>

<div id="root">
  <p class="status-msg" style="padding:60px 22px;text-align:center;">Loading your cart...</p>
</div>

<script type="module">
let fbApi = null;
let cartApi = null;
let currentCart = [];

function money(n){ return `BDT ${n}`; }

function renderEmpty(){
  document.getElementById('root').innerHTML = `
    <div class="empty-state">
      <p>Your cart is empty — add something first.</p>
      <a class="link-btn" href="shop.html">Browse the shop →</a>
    </div>`;
}

// Lazily imports firebase-config.js once and reuses the same handle for
// every Firestore call on this page (coupons, delivery settings, order
// number, order logging).
async function ensureFbApi(){
  if(!fbApi){
    const fb = await import('./js/firebase-config.js');
    fbApi = {
      db: fb.db, collection: fb.collection, addDoc: fb.addDoc, serverTimestamp: fb.serverTimestamp,
      doc: fb.doc, getDoc: fb.getDoc, setDoc: fb.setDoc, runTransaction: fb.runTransaction
    };
  }
  return fbApi;
}

// Mints the next friendly, sequential invoice number (FN1000, FN1001, ...)
// from a shared Firestore counter. If that fails for any reason (offline,
// rules not yet updated, etc.) we fall back to a still-numeric FN + timestamp
// code so an order is never blocked on this.
async function generateOrderNumber(){
  try{
    const fb = await ensureFbApi();
    if(!fb.runTransaction) throw new Error('runTransaction unavailable');
    const counterRef = fb.doc(fb.db, 'counters', 'orderNumber');
    const next = await fb.runTransaction(fb.db, async (tx)=>{
      const snap = await tx.get(counterRef);
      const n = (snap.exists && snap.exists() && Number(snap.data().next)) ? Number(snap.data().next) : 1000;
      tx.set(counterRef, { next: n + 1 }, { merge: true });
      return n;
    });
    return 'FN' + next;
  }catch(e){
    console.warn('Sequential order number unavailable, using fallback:', e);
    return 'FN' + Date.now().toString().slice(-8);
  }
}

function invoiceMarkup(inv){
  const itemsRows = inv.items.map(c=>`
    <tr>
      <td>${c.name}</td>
      <td style="text-align:center;">${c.qty}</td>
      <td style="text-align:right;">${money(c.price)}</td>
      <td style="text-align:right;">${money(c.price*c.qty)}</td>
    </tr>`).join('');
  return `
    <div class="invoice" id="invoiceBlock">
      <div class="inv-head">
        <div>
          <div class="inv-logo">FASHIONISTA</div>
          <div class="inv-sub">Invoice</div>
        </div>
        <div class="inv-meta">
          <div><b>Order #${inv.orderNumber}</b></div>
          <div>${inv.date}</div>
        </div>
      </div>
      <div class="inv-customer">
        <div><b>${inv.name}</b></div>
        <div>${inv.phone}</div>
        <div>${inv.address}</div>
        ${inv.note ? `<div>Note: ${inv.note}</div>` : ''}
      </div>
      <table class="inv-table">
        <thead><tr><th>Item</th><th style="text-align:center;">Qty</th><th style="text-align:right;">Price</th><th style="text-align:right;">Total</th></tr></thead>
        <tbody>${itemsRows}</tbody>
      </table>
      <div class="inv-totals">
        <div><span>Subtotal</span><span>${money(inv.subtotal)}</span></div>
        <div><span>Delivery (${inv.deliveryZone})</span><span>${money(inv.deliveryCharge)}</span></div>
        ${inv.discount > 0 ? `<div><span>Discount${inv.couponCode?` (${inv.couponCode})`:''}</span><span>-${money(inv.discount)}</span></div>` : ''}
        <div class="inv-grand"><span>Total</span><span>${money(inv.total)}</span></div>
      </div>
      <p class="inv-note">Cash on delivery — pay when your order arrives.</p>
      <button type="button" id="printInvoiceBtn">🖨 Print / save invoice</button>
    </div>`;
}

// waUrl opens WhatsApp with the order details pre-filled, so the buyer
// only has to tap "Send" to message the shop. inv (optional) is the invoice
// to render below the confirmation message.
function renderConfirm(waUrl, inv){
  document.getElementById('root').innerHTML = `
    <div class="confirm-state">
      <div class="confirm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div>
      <h2 class="display">Order placed</h2>
      <p>Thank you! Please tap the button below and send your order on WhatsApp so we can confirm it. Cash on delivery.</p>
      ${waUrl ? `<a class="place-btn" href="${waUrl}" target="_blank" rel="noopener" style="display:block;text-decoration:none;margin-bottom:16px;">Send order on WhatsApp</a>` : ''}
      <a class="link-btn" href="shop.html">Continue shopping →</a>
      ${inv ? invoiceMarkup(inv) : ''}
    </div>`;
  const printBtn = document.getElementById('printInvoiceBtn');
  if(printBtn) printBtn.addEventListener('click', ()=>window.print());
}

let DELIVERY_INSIDE_DHAKA = 70;
let DELIVERY_OUTSIDE_DHAKA = 130;
let appliedCoupon = null;

function getSubtotal(){
  return currentCart.reduce((sum,c)=>sum + c.price*c.qty, 0);
}

function itemsMarkup(cart){
  return cart.map(c=>`
    <div class="summary-item" data-id="${c.id}">
      <div class="si-media">${c.imageUrl?`<img src="${c.imageUrl}">`:''}</div>
      <div class="si-info">
        <h4>${c.name}</h4>
        <p>${money(c.price)} each</p>
        <div class="si-qty">
          <button type="button" class="qty-btn" data-action="dec" aria-label="Decrease quantity">−</button>
          <span>${c.qty}</span>
          <button type="button" class="qty-btn" data-action="inc" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <div class="si-right">
        <div class="si-total">${money(c.price*c.qty)}</div>
        <button type="button" class="si-remove" data-action="remove" aria-label="Remove item">Remove</button>
      </div>
    </div>`).join('');
}

function changeQty(id, delta){
  const item = currentCart.find(c=>c.id===id);
  if(!item) return;
  const next = item.qty + delta;
  if(next < 1){ removeItem(id); return; }
  if(cartApi) cartApi.updateQty(id, next);
  refreshCart();
}

function removeItem(id){
  if(cartApi) cartApi.removeFromCart(id);
  refreshCart();
}

// Re-read the cart from storage and update the item list + totals in place,
// so anything the shopper already typed in the form is kept.
function refreshCart(){
  currentCart = cartApi ? cartApi.getCart() : [];
  if(!currentCart.length){ renderEmpty(); return; }
  document.getElementById('itemsList').innerHTML = itemsMarkup(currentCart);
  updateTotals();
}

function renderCheckout(cart){
  currentCart = cart;
  const subtotal = getSubtotal();

  document.getElementById('root').innerHTML = `
    <div class="page-title">Checkout</div>
    <div class="section">
      <div class="section-label">Your order</div>
      <div id="itemsList">${itemsMarkup(cart)}</div>
      <a class="add-more" href="shop.html">+ Add more items</a>

      <div style="display:flex;gap:8px;margin-top:16px;">
        <input type="text" id="couponInput" placeholder="Coupon code" style="flex:1;padding:11px 14px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:var(--radius);font-size:13px;text-transform:uppercase;">
        <button id="couponApplyBtn" style="padding:11px 18px;border:1px solid var(--silver-deep);color:var(--silver-bright);background:none;border-radius:var(--radius);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;">Apply</button>
      </div>
      <p id="couponMsg" style="font-size:11.5px;margin-top:6px;display:none;"></p>

      <div class="total-row" style="padding-top:16px;font-size:13.5px;font-weight:400;color:var(--text-dim);">
        <span>Subtotal</span><span id="subtotalVal" style="color:var(--text-dim);">${money(subtotal)}</span>
      </div>
      <div class="total-row" style="padding-top:6px;font-size:13.5px;font-weight:400;color:var(--text-dim);">
        <span>Delivery</span><span id="deliveryVal" style="color:var(--text-dim);">${money(DELIVERY_INSIDE_DHAKA)}</span>
      </div>
      <div class="total-row" id="discountRow" style="padding-top:6px;font-size:13.5px;font-weight:400;color:var(--silver-bright);display:none;">
        <span>Discount</span><span id="discountVal">-${money(0)}</span>
      </div>
      <div class="total-row" style="padding-top:10px;border-top:1px solid var(--line);margin-top:8px;">
        <span>Total</span><span id="grandTotalVal">${money(subtotal + DELIVERY_INSIDE_DHAKA)}</span>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Delivery details</div>
      <div class="field" id="fName">
        <label>Full name</label>
        <input type="text" id="inName" placeholder="Your name">
        <p class="err">Name is required.</p>
      </div>
      <div class="field" id="fPhone">
        <label>Phone number</label>
        <input type="tel" id="inPhone" placeholder="01XXXXXXXXX">
        <p class="err">A valid phone number is required.</p>
      </div>
      <div class="field" id="fAddress">
        <label>Delivery address</label>
        <textarea id="inAddress" placeholder="House, road, area, city"></textarea>
        <p class="err">Address is required.</p>
      </div>

      <div class="field">
        <label>Delivery location</label>
        <div style="display:flex;gap:10px;">
          <label style="flex:1;display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--card);border:1px solid var(--silver);border-radius:2px;cursor:pointer;font-size:13px;">
            <input type="radio" name="deliveryZone" value="inside" checked style="width:auto;margin:0;">
            Inside Dhaka — ${money(DELIVERY_INSIDE_DHAKA)}
          </label>
          <label style="flex:1;display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:2px;cursor:pointer;font-size:13px;">
            <input type="radio" name="deliveryZone" value="outside" style="width:auto;margin:0;">
            Outside Dhaka — ${money(DELIVERY_OUTSIDE_DHAKA)}
          </label>
        </div>
      </div>

      <div class="field">
        <label>Order note (optional)</label>
        <textarea id="inNote" placeholder="Anything we should know?"></textarea>
      </div>

      <div class="pay-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        <span>Cash on delivery — pay when your order arrives. No online payment needed.</span>
      </div>

      <button class="place-btn" id="placeBtn">Place Order — ${money(subtotal + DELIVERY_INSIDE_DHAKA)}</button>
      <p class="status-msg" id="statusMsg"></p>
    </div>`;

  // + / − / Remove on each order item (event delegation, survives re-renders)
  document.getElementById('itemsList').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const row = btn.closest('.summary-item');
    if(!row) return;
    const id = row.dataset.id;
    const action = btn.dataset.action;
    if(action === 'inc') changeQty(id, +1);
    else if(action === 'dec') changeQty(id, -1);
    else if(action === 'remove') removeItem(id);
  });

  const zoneInputs = document.querySelectorAll('input[name="deliveryZone"]');
  zoneInputs.forEach(input=>{
    input.addEventListener('change', ()=>{
      zoneInputs.forEach(i=>{ i.closest('label').style.borderColor = i.checked ? 'var(--silver)' : 'var(--line)'; });
      updateTotals();
    });
  });

  appliedCoupon = null;
  document.getElementById('couponApplyBtn').addEventListener('click', ()=>applyCoupon());
  document.getElementById('couponInput').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); applyCoupon(); }
  });

  updateTotals();
  document.getElementById('placeBtn').addEventListener('click', ()=>placeOrder());
}

function getDeliveryCharge(){
  const checked = document.querySelector('input[name="deliveryZone"]:checked');
  return checked && checked.value === 'outside' ? DELIVERY_OUTSIDE_DHAKA : DELIVERY_INSIDE_DHAKA;
}

function getDiscountAmount(subtotal){
  if(!appliedCoupon) return 0;
  const raw = appliedCoupon.type === 'percent' ? subtotal * (appliedCoupon.value/100) : appliedCoupon.value;
  return Math.min(Math.round(raw), subtotal);
}

async function applyCoupon(){
  const input = document.getElementById('couponInput');
  const msg = document.getElementById('couponMsg');
  const code = input.value.trim().toUpperCase();
  if(!code){ return; }
  msg.style.display = 'block';
  msg.style.color = 'var(--text-dim)';
  msg.textContent = 'Checking code...';
  try{
    const fb = await ensureFbApi();
    const snap = await fb.getDoc(fb.doc(fb.db,'coupons',code));
    if(snap.exists && snap.exists()){
      const d = snap.data();
      appliedCoupon = { code, type: d.type, value: d.value };
      msg.style.color = 'var(--silver-bright)';
      msg.textContent = `"${code}" applied — ${d.type==='percent' ? d.value+'% off' : 'BDT '+d.value+' off'}.`;
    } else {
      appliedCoupon = null;
      msg.style.color = '#e08a8a';
      msg.textContent = 'That code isn\'t valid.';
    }
  }catch(e){
    console.error('Coupon check failed:', e);
    appliedCoupon = null;
    msg.style.color = '#e08a8a';
    msg.textContent = 'Could not check that code — try again.';
  }
  updateTotals();
}

function updateTotals(){
  const subtotal = getSubtotal();
  const delivery = getDeliveryCharge();
  const discount = getDiscountAmount(subtotal);
  const grand = Math.max(0, subtotal + delivery - discount);
  document.getElementById('subtotalVal').textContent = money(subtotal);
  document.getElementById('deliveryVal').textContent = money(delivery);
  const discountRow = document.getElementById('discountRow');
  if(discount > 0){
    discountRow.style.display = 'flex';
    document.getElementById('discountVal').textContent = `-${money(discount)}`;
  } else {
    discountRow.style.display = 'none';
  }
  document.getElementById('grandTotalVal').textContent = money(grand);
  document.getElementById('placeBtn').textContent = `Place Order — ${money(grand)}`;
}

function validate(){
  const name = document.getElementById('inName').value.trim();
  const phone = document.getElementById('inPhone').value.trim();
  const address = document.getElementById('inAddress').value.trim();
  let ok = true;

  const nameField = document.getElementById('fName');
  nameField.classList.toggle('invalid', !name);
  if(!name) ok = false;

  const phoneField = document.getElementById('fPhone');
  const phoneValid = /^[0-9+\-\s]{7,15}$/.test(phone);
  phoneField.classList.toggle('invalid', !phoneValid);
  if(!phoneValid) ok = false;

  const addrField = document.getElementById('fAddress');
  addrField.classList.toggle('invalid', !address);
  if(!address) ok = false;

  return ok ? { name, phone, address, note: document.getElementById('inNote').value.trim() } : null;
}

async function placeOrder(){
  const details = validate();
  if(!details) return;

  const cart = currentCart;
  const subtotal = getSubtotal();
  const deliveryCharge = getDeliveryCharge();
  const deliveryZone = document.querySelector('input[name="deliveryZone"]:checked').value === 'outside'
    ? 'Outside Dhaka' : 'Inside Dhaka';
  const discount = getDiscountAmount(subtotal);
  const grandTotal = Math.max(0, subtotal + deliveryCharge - discount);

  const btn = document.getElementById('placeBtn');
  const status = document.getElementById('statusMsg');
  btn.disabled = true;
  status.textContent = 'Placing your order...';

  // A friendly, sequential invoice number (e.g. FN1000) — minted first so it
  // can be stored with the order, shown on WhatsApp, and printed on the
  // invoice below, even if the Firestore order-logging step fails.
  const orderNumber = await generateOrderNumber();

  // Try to log the order to Firestore. If this fails for any reason, we
  // still continue so the buyer can send the order on WhatsApp.
  let orderId = '';
  try{
    const fb = await ensureFbApi();
    const orderRef = await fb.addDoc(fb.collection(fb.db,'orders'), {
      orderNumber,
      customerName: details.name,
      phone: details.phone,
      address: details.address,
      note: details.note,
      items: cart.map(c=>({ id:c.id, name:c.name, price:c.price, qty:c.qty })),
      subtotal,
      deliveryZone,
      deliveryCharge,
      couponCode: appliedCoupon ? appliedCoupon.code : null,
      discount,
      total: grandTotal,
      status: 'pending',
      createdAt: fb.serverTimestamp()
    });
    orderId = orderRef.id;
  }catch(e){
    console.error('Order logging failed (continuing anyway):', e);
  }

  // Background ping to the owner (email, plus WhatsApp if it is configured on
  // the server). Fire-and-forget: it never blocks or breaks the checkout.
  try{
    fetch('/api/notify-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      keepalive: true,
      body: JSON.stringify({
        orderId,
        orderNumber,
        customerName: details.name,
        phone: details.phone,
        address: details.address,
        note: details.note,
        items: cart.map(c=>({ name:c.name, price:c.price, qty:c.qty })),
        subtotal,
        deliveryZone,
        deliveryCharge,
        couponCode: appliedCoupon ? appliedCoupon.code : null,
        discount,
        total: grandTotal
      })
    }).catch(e=>console.warn('Owner notification failed:', e));
  }catch(e){ console.warn('Owner notification failed:', e); }

  // WhatsApp message for the buyer to send to the shop.
  const lines = cart.map(c=>`• ${c.name} x${c.qty} — BDT ${c.price*c.qty}`).join('\n');
  const discountLine = discount > 0 ? `\nDiscount (${appliedCoupon.code}): -BDT ${discount}` : '';
  const msg = `Hi! I'd like to place an order:\n\nOrder #: ${orderNumber}\n\n${lines}\n\nSubtotal: BDT ${subtotal}\nDelivery (${deliveryZone}): BDT ${deliveryCharge}${discountLine}\nTotal: BDT ${grandTotal}\n\nName: ${details.name}\nPhone: ${details.phone}\nAddress: ${details.address}${details.note ? `\nNote: ${details.note}` : ''}`;
  const waUrl = `https://wa.me/8801759406602?text=${encodeURIComponent(msg)}`;

  const now = new Date();
  const invoice = {
    orderNumber,
    date: now.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) + ' at ' + now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }),
    items: cart,
    subtotal, deliveryZone, deliveryCharge, discount,
    couponCode: appliedCoupon ? appliedCoupon.code : '',
    total: grandTotal,
    name: details.name, phone: details.phone, address: details.address, note: details.note
  };

  if(cartApi) cartApi.clearCart();
  renderConfirm(waUrl, invoice);
  // Try to open WhatsApp right away. If the browser blocks the popup, the
  // "Send order on WhatsApp" button on the confirmation screen does the same.
  try{ window.open(waUrl, '_blank'); }catch(e){}
}

async function loadDeliverySettings(){
  try{
    const fb = await ensureFbApi();
    const fetchPromise = fb.getDoc(fb.doc(fb.db,'settings','delivery'));
    const timeout = new Promise(resolve => setTimeout(()=>resolve(null), 4000));
    const snap = await Promise.race([fetchPromise, timeout]);
    if(snap && snap.exists && snap.exists()){
      const d = snap.data();
      if(d.insideDhaka) DELIVERY_INSIDE_DHAKA = d.insideDhaka;
      if(d.outsideDhaka) DELIVERY_OUTSIDE_DHAKA = d.outsideDhaka;
    }
  }catch(e){
    console.error('Delivery settings load failed, using defaults:', e);
  }
}

async function init(){
  try{
    cartApi = await import('./js/cart.js');
  }catch(e){
    console.error('Cart module failed to load:', e);
  }
  const cart = cartApi ? cartApi.getCart() : [];
  if(!cart.length){ renderEmpty(); return; }
  await loadDeliverySettings();
  renderCheckout(cart);
}
init();
</script>
